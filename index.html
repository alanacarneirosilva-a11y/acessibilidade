<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segurança Digital para Idosos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA DE ACESSIBILIDADE -->
  <nav class="barra-acessibilidade" aria-label="Controles de Acessibilidade">
    <button id="btnAumentaTexto" class="botao-controle" title="Aumentar texto">A+ Aumentar</button>
    <button id="btnDiminuiTexto" class="botao-controle" title="Diminuir texto">A- Diminuir</button>
    <button id="btnVoz" class="botao-controle botao-leitura" title="Ouvir conteúdo">🔊 Ouvir Página</button>
    <button id="btnPararVoz" class="botao-controle" title="Parar leitura">⏹️ Parar</button>
  </nav>

  <header class="cabecalho">
    <div class="banner">
      <h1>Segurança Digital para Idosos</h1>
    </div>
  </header>

  <main>
    <section class="conteudo-principal">
      <h2>Dicas de Acessibilidade e Proteção</h2>
      <p>Navegar na internet de forma segura envolve reconhecer links confiáveis e utilizar ferramentas de auxílio visual e auditivo.</p>
      
      <button class="botao-ajuda">Ajuda</button>
    </section>
  </main>

  <!-- MODAL DE AJUDA -->
  <div class="modal-fundo">
    <div class="modal-conteudo">
      <p>Precisa de suporte com as ferramentas de acessibilidade?</p>
      <button class="botao-ajuda botao-fechar">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
